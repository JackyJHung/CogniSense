<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- viewport-fit=cover lets the tab bar sit over the iPhone home indicator
         and pad itself with safe-area-inset-bottom, as native tab bars do. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Daily memory check-ins and reminders for self-tracking. Not a medical diagnostic device."
    />

    <!-- Installable web app. On a phone this replaces a native app, and on
         iOS it is also the only way to get reminders: Safari delivers web push
         solely to a web app added to the Home Screen (iOS 16.4+). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CogniSense" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Both spellings: iOS reads the apple- one, Chrome asks for the other. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>CogniSense</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
